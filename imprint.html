<style>
:root{--pink:#FF2E88;--teal:#2EE6D6;--ink:#07060F;--text:#f4f2fb;--muted:#b9b3cc}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.6}
.hero{min-height:78vh;display:flex;flex-direction:column;justify-content:flex-end;padding:0 16px 56px;
background:linear-gradient(180deg,rgba(7,6,15,.2) 0%,rgba(7,6,15,.65) 60%,var(--ink) 100%),url(banner.jpg) center/cover no-repeat}
.wrap{max-width:880px;margin:0 auto;width:100%}
.logo{width:88px;height:88px;border-radius:50%;box-shadow:0 0 40px rgba(255,46,136,.45)}
h1{font-family:"Arial Black","Helvetica Neue",Arial,sans-serif;font-weight:900;font-size:clamp(40px,9vw,88px);line-height:1;margin:22px 0 14px;letter-spacing:-.02em;
background:linear-gradient(180deg,#fff,#ffd6e8 60%,var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{font-size:clamp(18px,2.6vw,22px);color:var(--muted);max-width:620px;margin:0 0 28px}
.btn{display:inline-flex;align-items:center;gap:10px;background:var(--teal);color:var(--ink);font-weight:800;text-decoration:none;
padding:14px 26px;border-radius:999px;box-shadow:0 0 30px rgba(46,230,214,.45)}
main{padding:24px 16px 64px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:8px}
.card{background:linear-gradient(160deg,rgba(255,255,255,.08),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.12);border-radius:22px;padding:22px}
.card b{display:block;font-family:"Arial Black","Helvetica Neue",Arial,sans-serif;font-size:18px;margin-bottom:6px}
.card span{color:var(--muted)}
h2{font-family:"Arial Black","Helvetica Neue",Arial,sans-serif;font-size:22px;margin:44px 0 12px}
footer{border-top:1px solid rgba(255,255,255,.1);padding:28px 16px;color:var(--muted);font-size:14px}
footer a{color:var(--teal)}
</style>
<style>main{padding-top:40px} h1{font-size:clamp(32px,6vw,52px)} p,li{color:var(--text)} a{color:var(--teal)}</style>
